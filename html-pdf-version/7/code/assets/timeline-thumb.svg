<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <rect width="320" height="180" fill="#ffffff"/>
  <rect x="0" y="0" width="320" height="28" fill="#001a57"/>
  <text x="160" y="18" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="7" font-weight="700">HISTORY OF MENTAL HEALTH SYSTEMS &amp; CRIMINALIZATION IN FLORIDA</text>
  <g font-family="Arial, sans-serif" font-size="5" fill="#1a1a1a">
    <rect x="6" y="34" width="58" height="140" fill="#f5f5f5" stroke="#ccc"/>
    <text x="35" y="46" text-anchor="middle" font-weight="700">1840s</text>
    <rect x="12" y="52" width="46" height="28" fill="#ddd"/>
    <text x="35" y="88" text-anchor="middle">Asylum era</text>
    <rect x="70" y="34" width="58" height="140" fill="#f5f5f5" stroke="#ccc"/>
    <text x="99" y="46" text-anchor="middle" font-weight="700">1950s</text>
    <rect x="76" y="52" width="46" height="28" fill="#ddd"/>
    <text x="99" y="88" text-anchor="middle">Deinstitutionalization</text>
    <rect x="134" y="34" width="58" height="140" fill="#f5f5f5" stroke="#ccc"/>
    <text x="163" y="46" text-anchor="middle" font-weight="700">1980s</text>
    <rect x="140" y="52" width="46" height="28" fill="#ddd"/>
    <text x="163" y="88" text-anchor="middle">Criminalization</text>
    <rect x="198" y="34" width="58" height="140" fill="#f5f5f5" stroke="#ccc"/>
    <text x="227" y="46" text-anchor="middle" font-weight="700">2000s</text>
    <rect x="204" y="52" width="46" height="28" fill="#ddd"/>
    <text x="227" y="88" text-anchor="middle">Jail diversion</text>
    <rect x="262" y="34" width="52" height="140" fill="#f5f5f5" stroke="#ccc"/>
    <text x="288" y="46" text-anchor="middle" font-weight="700">Today</text>
    <rect x="266" y="52" width="44" height="28" fill="#ddd"/>
    <text x="288" y="88" text-anchor="middle">Restorative care</text>
  </g>
</svg>
